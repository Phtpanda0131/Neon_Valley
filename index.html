    <!-- Shim process.env for browser compatibility -->
    <script>
      window.process = window.process || { env: { API_KEY: "" } };

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@300;400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #020617;
        color: #f8fafc;
        font-family: 'Rajdhani', sans-serif;
        font-size: 18px;
        min-height: 100vh;
      }
      .font-orbitron { font-family: 'Orbitron', sans-serif; }
      .font-mono { font-family: 'Share Tech Mono', monospace; }
      
      .scanline {
        width: 100%;
        height: 100px;
        z-index: 99;
        background: linear-gradient(0deg, rgba(0, 0, 0, 0) 0%, rgba(6, 182, 212, 0.03) 50%, rgba(0, 0, 0, 0) 100%);
        opacity: 0.1;
        position: fixed;
        top: 0;
        left: 0;
        animation: scanline 10s linear infinite;
        pointer-events: none;
      }
      @keyframes scanline {
        0% { transform: translateY(-100px); }
        100% { transform: translateY(100vh); }
      }
      
      .neon-text-cyan { text-shadow: 0 0 10px rgba(6, 182, 212, 0.8); }
      .neon-text-pink { text-shadow: 0 0 10px rgba(236, 72, 153, 0.8); }
      
      .clip-path-cyber {
        clip-path: polygon(10% 0, 100% 0, 100% 70%, 90% 100%, 0 100%, 0 30%);
      }

      ::-webkit-scrollbar { width: 4px; }
      ::-webkit-scrollbar-track { background: #0f172a; }
      ::-webkit-scrollbar-thumb { background: #06b6d4; border-radius: 2px; }
    </style>

        <div style="border: 1px solid #06b6d4; padding: 2rem; display: flex; flex-direction: column; align-items: center; gap: 1rem;">
          <div style="font-size: 0.8rem; letter-spacing: 0.5rem; opacity: 0.5;">UPLINK_STATUS</div>

          </div>
        </div>
      </div>
    </div>
    <style>
      @keyframes loading {
        0% { left: -50px; }
