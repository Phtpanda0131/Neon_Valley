
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NEON-VALLEY: Cyberpunk D&D Sheet</title>
    <!-- Critical: Shim process safely for browser environment without overwriting pre-injected keys -->
    <script>
      (function() {
        window.process = window.process || {};
        window.process.env = window.process.env || {};
        if (typeof window.process.env.API_KEY === 'undefined') {
          window.process.env.API_KEY = "";
        }
      })();
      
      window.onerror = function(msg, url, lineNo, columnNo, error) {
        const root = document.getElementById('root');
        if (root) {
          root.innerHTML = `
            <div style="padding: 2rem; background: #020617; border: 2px solid #ef4444; color: #fecaca; font-family: 'Orbitron', sans-serif; max-width: 600px; margin: 2rem auto; box-shadow: 0 0 50px rgba(239, 68, 68, 0.2);">
              <h1 style="color: #ef4444; margin-bottom: 1rem; letter-spacing: 0.2rem;">CRITICAL_SYSTEM_FAILURE</h1>
              <p style="font-size: 0.8rem; margin-bottom: 1rem; font-family: 'Share Tech Mono';">ERROR_LOG_V2.5:</p>
              <code style="display: block; background: #000; padding: 1rem; font-family: 'Share Tech Mono'; color: #f87171; border: 1px solid #450a0a; overflow-x: auto;">
                ${msg}<br>at ${url}:${lineNo}
              </code>
              <p style="margin-top: 1rem; font-size: 0.7rem; opacity: 0.7; font-family: 'Share Tech Mono';">RECOVERY_STEPS: Check Net-link integrity. Refresh neural interface.</p>
            </div>
          `;
        }
        return false;
      };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@300;400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
      :root {
        --cyan: #06b6d4;
        --pink: #ec4899;
        --amber: #f59e0b;
        --emerald: #10b981;
        --slate-950: #020617;
      }

      body {
        margin: 0;
        padding: 0;
        background-color: var(--slate-950);
        background-image: 
          radial-gradient(circle at 50% 50%, rgba(6, 182, 212, 0.05) 0%, transparent 80%),
          linear-gradient(rgba(15, 23, 42, 0.5) 1px, transparent 1px),
          linear-gradient(90deg, rgba(15, 23, 42, 0.5) 1px, transparent 1px);
        background-size: 100% 100%, 40px 40px, 40px 40px;
        color: #f8fafc;
        font-family: 'Rajdhani', sans-serif;
        font-size: 18px;
        min-height: 100vh;
        overflow-x: hidden;
      }
      
      .font-orbitron { font-family: 'Orbitron', sans-serif; }
      .font-mono { font-family: 'Share Tech Mono', monospace; }
      
      .scanline {
        width: 100%;
        height: 4px;
        z-index: 9999;
        background: rgba(6, 182, 212, 0.1);
        opacity: 0.5;
        position: fixed;
        top: 0;
        left: 0;
        animation: scanline 8s linear infinite;
        pointer-events: none;
        box-shadow: 0 0 10px rgba(6, 182, 212, 0.5);
      }
      
      @keyframes scanline {
        0% { transform: translateY(-10vh); }
        100% { transform: translateY(110vh); }
      }
      
      .neon-text-cyan { text-shadow: 0 0 10px rgba(6, 182, 212, 0.8), 0 0 20px rgba(6, 182, 212, 0.3); }
      .neon-text-pink { text-shadow: 0 0 10px rgba(236, 72, 153, 0.8), 0 0 20px rgba(236, 72, 153, 0.3); }
      .neon-text-amber { text-shadow: 0 0 10px rgba(245, 158, 11, 0.8); }
      
      .cyber-card {
        background: rgba(15, 23, 42, 0.7);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(6, 182, 212, 0.15);
        position: relative;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }
      
      .cyber-card::before {
        content: '';
        position: absolute;
        top: -1px;
        left: -1px;
        width: 15px;
        height: 15px;
        border-top: 2px solid var(--cyan);
        border-left: 2px solid var(--cyan);
      }

      .cyber-card::after {
        content: '';
        position: absolute;
        bottom: -1px;
        right: -1px;
        width: 15px;
        height: 15px;
        border-bottom: 2px solid var(--cyan);
        border-right: 2px solid var(--cyan);
      }

      .clip-path-cyber {
        clip-path: polygon(0 15px, 15px 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%);
      }

      .glitch-hover:hover {
        animation: glitch 0.3s infinite;
      }

      @keyframes glitch {
        0% { transform: translate(0); }
        20% { transform: translate(-2px, 1px); color: var(--pink); }
        40% { transform: translate(2px, -1px); color: var(--cyan); }
        60% { transform: translate(-1px, 0); }
        80% { transform: translate(1px, 1px); }
        100% { transform: translate(0); }
      }

      ::-webkit-scrollbar { width: 4px; }
      ::-webkit-scrollbar-track { background: #020617; }
      ::-webkit-scrollbar-thumb { background: var(--cyan); border-radius: 0; box-shadow: 0 0 10px var(--cyan); }

      .custom-scrollbar::-webkit-scrollbar { width: 3px; }
      .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(6, 182, 212, 0.3); }

      /* Tactical Grid background for Armory */
      .bg-tactical {
        background-image: 
          radial-gradient(circle at 2px 2px, rgba(6, 182, 212, 0.1) 1px, transparent 0);
        background-size: 12px 12px;
      }

      input::placeholder, textarea::placeholder {
        color: rgba(6, 182, 212, 0.3);
        text-transform: uppercase;
        font-size: 0.7rem;
        letter-spacing: 0.1rem;
      }
    </style>
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",

    "@google/genai": "https://esm.sh/@google/genai@1.3.0",

    "react/": "https://esm.sh/react@^19.2.3/"
  }
}
</script>
  <link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root">
      <div style="display: flex; height: 100vh; flex-direction: column; align-items: center; justify-content: center; font-family: 'Orbitron', sans-serif; color: #06b6d4; background: #020617;">
        <div style="border: 1px solid rgba(6, 182, 212, 0.3); padding: 4rem; display: flex; flex-direction: column; align-items: center; gap: 1.5rem; background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(20px); clip-path: polygon(0 20px, 20px 0, 100% 0, 100% calc(100% - 20px), calc(100% - 20px) 100%, 0 100%); position: relative;">
          <div style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; border: 1px solid rgba(6, 182, 212, 0.1); z-index: -1;"></div>
          <div style="font-size: 0.6rem; letter-spacing: 0.8rem; opacity: 0.6; text-transform: uppercase; color: #ec4899;">Neural Interface</div>
          <div style="font-size: 1.5rem; font-weight: 900; letter-spacing: 0.2rem; text-shadow: 0 0 20px rgba(6, 182, 212, 0.6); text-transform: uppercase;">Neon_Valley_OS</div>
          <div style="width: 300px; height: 2px; background: rgba(6, 182, 212, 0.1); position: relative; overflow: hidden; margin: 1rem 0;">
            <div style="position: absolute; width: 100px; height: 100%; background: linear-gradient(90deg, transparent, #06b6d4, transparent); animation: loading 2s infinite ease-in-out;"></div>
          </div>
          <div style="font-family: 'Share Tech Mono', monospace; font-size: 0.7rem; color: #475569; letter-spacing: 0.1rem;">INIT_SEQUENCE: SYNCING_BIO_METRICS...</div>
        </div>
      </div>
    </div>
    <style>
      @keyframes loading {
        0% { left: -100px; }
        100% { left: 300px; }
      }
    </style>
    <div class="scanline"></div>
    <script type="module" src="index.tsx"></script>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
