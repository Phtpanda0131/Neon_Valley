    <title>NEON-VALLEY: Cyberpunk D&D Sheet</title>
    <!-- Critical: Shim process safely for browser environment without overwriting pre-injected keys -->
    <script>
      (function() {
        window.process = window.process || {};
        window.process.env = window.process.env || {};
        if (typeof window.process.env.API_KEY === 'undefined') {
          window.process.env.API_KEY = "";
        }
      })();
      
      window.onerror = function(msg, url, lineNo, columnNo, error) {
        const root = document.getElementById('root');
        if (root) {
          root.innerHTML = `
            <div style="padding: 2rem; background: #1e1b4b; border: 2px solid #ef4444; color: #fecaca; font-family: 'Orbitron', sans-serif; max-width: 600px; margin: 2rem auto;">
              <h1 style="color: #ef4444; margin-bottom: 1rem;">NEURAL LINK FAILURE</h1>
              <p style="font-size: 0.8rem; margin-bottom: 1rem;">CRITICAL ERROR DETECTED DURING INITIALIZATION:</p>
              <code style="display: block; background: #000; padding: 1rem; font-family: monospace; color: #f87171; border: 1px solid #450a0a;">
                ${msg}<br>at ${url}:${lineNo}
              </code>
              <p style="margin-top: 1rem; font-size: 0.7rem; opacity: 0.7;">Check your internet connection and ensuring your API configuration is stable.</p>
            </div>
          `;
        }
        return false;
      };
    </script>

      .scanline {

        position: fixed;
        top: 0;
        left: 0;
        animation: scanline 10s linear infinite;
        pointer-events: none;
      }
      @keyframes scanline {
        0% { transform: translateY(-100px); }
        100% { transform: translateY(100vh); }
      }
      
      .neon-text-cyan { text-shadow: 0 0 10px rgba(6, 182, 212, 0.8); }

    </style>
